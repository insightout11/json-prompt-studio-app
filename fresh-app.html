<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh AI Video Prompt Generator - No Cache</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
      .container { max-width: 800px; margin: 0 auto; }
      textarea { width: 100%; height: 100px; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
      button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
      button:hover { background: #0056b3; }
      button:disabled { background: #ccc; cursor: not-allowed; }
      .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 5px; margin: 10px 0; }
      .success { color: green; background: #e6ffe6; padding: 10px; border-radius: 5px; margin: 10px 0; }
      .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin: 20px 0; }
      .field { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
      .field-label { font-weight: bold; color: #333; }
      .field-value { margin-top: 5px; color: #666; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚨 Fresh AI Video Prompt Generator - No Cache 🚨</h1>
      
      <div>
        <h3>Text to JSON Converter</h3>
        <textarea id="prompt" placeholder="Describe your scene in natural language..."></textarea>
        <button onclick="convertToJson()" id="convertBtn">Convert to JSON</button>
        <button onclick="enhanceJson()" id="enhanceBtn" style="display:none;">Enhance Fields</button>
      </div>
      
      <div id="status"></div>
      <div id="fields" class="fields"></div>
    </div>

    <script>
      console.log('🚨🚨🚨 FRESH APP LOADED - NO REACT, NO CACHE 🚨🚨🚨');
      
      let currentFields = {};
      let hasConverted = false;
      
      async function convertToJson() {
        const prompt = document.getElementById('prompt').value.trim();
        const statusDiv = document.getElementById('status');
        const convertBtn = document.getElementById('convertBtn');
        
        if (!prompt) {
          statusDiv.innerHTML = '<div class="error">Please enter a scene description</div>';
          return;
        }
        
        convertBtn.disabled = true;
        convertBtn.textContent = 'Converting...';
        statusDiv.innerHTML = '<div>Converting text to JSON...</div>';
        
        try {
          console.log('🔥 Making direct API call for text-to-json conversion');
          
          const response = await fetch('/api/groq', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              messages: [{
                role: 'user', 
                content: `Convert this scene description into structured JSON prompt fields. Return ONLY a JSON object with field names and values.

Scene Description: "${prompt}"

Extract relevant details for these fields:
- scene: Overall scene description
- character_type: Type of character
- setting: Location/environment  
- actions: What's happening
- emotions: Character emotions
- lighting_type: Lighting conditions
- time_of_day: Time setting
- camera_angle: Camera perspective
- camera_distance: Shot type
- style: Visual style
- color_palette: Color scheme
- atmosphere: Overall mood
- clothing: Character clothing
- hair_color, hair_style: Character appearance
- age, gender: Character demographics
- environment: Weather/conditions

Return ONLY valid JSON with fields you're confident about. Use descriptive but concise values.`
              }],
              temperature: 0.3,
              max_tokens: 800,
              model: 'llama-3.1-8b-instant'
            })
          });
          
          console.log('🔥 API response status:', response.status);
          
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`API request failed: ${response.status} - ${errorText}`);
          }
          
          const responseText = await response.text();
          console.log('🔥 Raw response text (first 300 chars):', responseText.substring(0, 300));
          
          const apiData = JSON.parse(responseText);
          console.log('🔥 Parsed API data:', apiData);
          
          const aiContent = apiData.choices[0].message.content;
          console.log('🔥 AI content:', aiContent);
          
          // Parse the AI response
          let cleanedResponse = aiContent.trim();
          cleanedResponse = cleanedResponse.replace(/```json\s*/gi, '').replace(/```\s*$/gi, '');
          cleanedResponse = cleanedResponse.replace(/```\s*/gi, '');
          
          const jsonStart = cleanedResponse.indexOf('{');
          const jsonEnd = cleanedResponse.lastIndexOf('}');
          
          if (jsonStart !== -1 && jsonEnd !== -1 && jsonEnd > jsonStart) {
            cleanedResponse = cleanedResponse.substring(jsonStart, jsonEnd + 1);
          }
          
          console.log('🔍 Cleaned JSON for parsing:', cleanedResponse);
          const jsonData = JSON.parse(cleanedResponse);
          console.log('🔍 Successfully parsed JSON:', jsonData);
          
          // Store and display results
          currentFields = jsonData;
          hasConverted = true;
          displayFields(jsonData);
          
          statusDiv.innerHTML = '<div class="success">✅ Successfully converted to JSON!</div>';
          document.getElementById('enhanceBtn').style.display = 'inline-block';
          
        } catch (error) {
          console.error('🚨 Conversion error:', error);
          statusDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
        } finally {
          convertBtn.disabled = false;
          convertBtn.textContent = 'Convert to JSON';
        }
      }
      
      async function enhanceJson() {
        const statusDiv = document.getElementById('status');
        const enhanceBtn = document.getElementById('enhanceBtn');
        
        enhanceBtn.disabled = true;
        enhanceBtn.textContent = 'Enhancing...';
        statusDiv.innerHTML = '<div>Enhancing JSON fields...</div>';
        
        try {
          console.log('🔥 Making direct API call for enhancement');
          
          const currentFieldsList = Object.entries(currentFields)
            .filter(([key, value]) => value && value.trim() !== '')
            .map(([key, value]) => `- ${key}: "${value}"`)
            .join('\n');
            
          const response = await fetch('/api/groq', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              messages: [
                { role: 'system', content: 'You are an expert at enhancing and expanding creative content with rich, specific details.' },
                { 
                  role: 'user', 
                  content: `Enhance these existing JSON fields with more depth and specificity:

Current fields:
${currentFieldsList}

INSTRUCTIONS:
1. Keep all existing content but make it MORE detailed and specific
2. Add new complementary fields that weren't filled before
3. Focus on adding layers of detail, specificity, and richness

Return enhanced JSON with richer, more detailed descriptions.`
                }
              ],
              temperature: 0.8,
              max_tokens: 1000,
              model: 'llama-3.1-8b-instant'
            })
          });
          
          console.log('🔥 Enhancement API response status:', response.status);
          
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`API request failed: ${response.status} - ${errorText}`);
          }
          
          const responseText = await response.text();
          console.log('🔥 Enhancement raw response:', responseText.substring(0, 300));
          
          const apiData = JSON.parse(responseText);
          const aiContent = apiData.choices[0].message.content;
          
          // Parse enhanced JSON
          let cleanedResponse = aiContent.trim();
          cleanedResponse = cleanedResponse.replace(/```json\s*/gi, '').replace(/```\s*$/gi, '');
          cleanedResponse = cleanedResponse.replace(/```\s*/gi, '');
          
          const jsonStart = cleanedResponse.indexOf('{');
          const jsonEnd = cleanedResponse.lastIndexOf('}');
          
          if (jsonStart !== -1 && jsonEnd !== -1 && jsonEnd > jsonStart) {
            cleanedResponse = cleanedResponse.substring(jsonStart, jsonEnd + 1);
          }
          
          const enhancedData = JSON.parse(cleanedResponse);
          console.log('🔍 Enhanced JSON data:', enhancedData);
          
          // Merge with existing fields
          currentFields = { ...currentFields, ...enhancedData };
          displayFields(currentFields);
          
          statusDiv.innerHTML = '<div class="success">✅ Successfully enhanced JSON!</div>';
          
        } catch (error) {
          console.error('🚨 Enhancement error:', error);
          statusDiv.innerHTML = `<div class="error">❌ Enhancement Error: ${error.message}</div>`;
        } finally {
          enhanceBtn.disabled = false;
          enhanceBtn.textContent = 'Enhance Fields';
        }
      }
      
      function displayFields(data) {
        const fieldsDiv = document.getElementById('fields');
        
        if (Object.keys(data).length === 0) {
          fieldsDiv.innerHTML = '<div>No fields generated</div>';
          return;
        }
        
        const fieldsHtml = Object.entries(data)
          .filter(([key, value]) => value && value.trim() !== '')
          .map(([key, value]) => `
            <div class="field">
              <div class="field-label">${key.replace(/_/g, ' ')}</div>
              <div class="field-value">${value}</div>
            </div>
          `).join('');
          
        fieldsDiv.innerHTML = fieldsHtml;
      }
    </script>
  </body>
</html>
