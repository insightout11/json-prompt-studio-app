<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Direct API - No Cache</title>
</head>
<body>
    <div id="root">
        <h1>🚨 TESTING DIRECT API CALLS - NO CACHE 🚨</h1>
        <textarea id="prompt" placeholder="Enter text..."></textarea>
        <button onclick="testAPI()">Test Direct API Call</button>
        <div id="result"></div>
    </div>
    
    <script>
        console.log('🚨🚨🚨 TEST PAGE LOADED - NO VITE, NO CACHE 🚨🚨🚨');
        
        async function testAPI() {
            const prompt = document.getElementById('prompt').value;
            const resultDiv = document.getElementById('result');
            
            if (!prompt.trim()) {
                resultDiv.innerHTML = '<p style="color: red;">Please enter some text</p>';
                return;
            }
            
            resultDiv.innerHTML = '<p>Making direct API call...</p>';
            console.log('🔥 Making direct API call to /api/groq');
            
            try {
                const response = await fetch('/api/groq', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: `Convert this to JSON: ${prompt}` }],
                        temperature: 0.3,
                        max_tokens: 500,
                        model: 'llama-3.1-8b-instant'
                    })
                });
                
                console.log('🔥 Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API failed: ${response.status} - ${errorText}`);
                }
                
                const responseText = await response.text();
                console.log('🔥 Raw response text:', responseText);
                
                const data = JSON.parse(responseText);
                console.log('🔥 Parsed data:', data);
                
                const aiContent = data.choices[0].message.content;
                console.log('🔥 AI content:', aiContent);
                
                resultDiv.innerHTML = `
                    <h3>✅ API Call Successful!</h3>
                    <p><strong>Response Status:</strong> ${response.status}</p>
                    <p><strong>AI Content:</strong></p>
                    <pre style="background: #f0f0f0; padding: 10px; white-space: pre-wrap;">${aiContent}</pre>
                `;
                
            } catch (error) {
                console.error('🚨 API call failed:', error);
                resultDiv.innerHTML = `
                    <h3>❌ API Call Failed</h3>
                    <p style="color: red;"><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
    </script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; }
        textarea { width: 100%; height: 100px; margin: 10px 0; padding: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; min-height: 50px; }
        pre { overflow-x: auto; }
    </style>
</body>
</html>
