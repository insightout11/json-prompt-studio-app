<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Test - JSON Prompt Studio</title>
    <!-- Tailwind CSS - Deferred to avoid render blocking -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <style>
        /* Import our responsive CSS */
        @import url('./index.css');
        
        .breakpoint-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            z-index: 10000;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 1024px) {
            .test-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-light-surface dark:bg-cinema-black">
    <!-- Breakpoint Indicator -->
    <div class="breakpoint-indicator">
        <span id="current-breakpoint">Loading...</span>
    </div>

    <!-- Test Container -->
    <div class="container mx-auto responsive-spacing">
        <h1 class="fluid-text-lg font-bold text-center mb-8">Responsive Test Page</h1>
        
        <!-- Test Grid -->
        <div class="test-grid main-grid mb-8">
            <!-- Left Panel -->
            <div class="scene-builder-above bg-light-panel dark:bg-cinema-panel responsive-spacing rounded-lg shadow-light-elevated dark:shadow-glow-soft">
                <h2 class="fluid-text-base font-semibold mb-4">Scene Builder (Above on Mobile)</h2>
                <div class="button-wrap-mobile lg:flex lg:space-x-2">
                    <button class="mobile-minimal bg-blue-500 text-white rounded">Button 1</button>
                    <button class="mobile-minimal bg-green-500 text-white rounded">Button 2</button>
                    <button class="mobile-minimal bg-purple-500 text-white rounded">Button 3</button>
                </div>
            </div>
            
            <!-- Right Panel -->
            <div class="json-panel-below bg-light-panel dark:bg-cinema-panel responsive-spacing rounded-lg shadow-light-elevated dark:shadow-glow-soft">
                <h2 class="fluid-text-base font-semibold mb-4">JSON Panel (Below on Mobile)</h2>
                <div class="button-stack md:flex-row md:space-y-0 md:space-x-2 flex flex-col space-y-2">
                    <button class="mobile-minimal bg-teal-500 text-white rounded">Copy</button>
                    <button class="mobile-minimal bg-orange-500 text-white rounded">Save</button>
                    <button class="mobile-minimal bg-red-500 text-white rounded">Clear</button>
                </div>
            </div>
        </div>
        
        <!-- Test Header -->
        <header class="mobile-stack lg:flex-row lg:items-center lg:justify-between responsive-spacing bg-light-panel dark:bg-cinema-panel rounded-lg mb-8">
            <div class="flex items-center responsive-gap">
                <span class="text-2xl">🧪</span>
                <h3 class="fluid-text-base font-semibold">Test Header</h3>
            </div>
            <div class="button-wrap-mobile lg:flex lg:items-center responsive-gap">
                <button class="mobile-minimal bg-blue-500 text-white rounded">Tool 1</button>
                <button class="mobile-minimal bg-green-500 text-white rounded">Tool 2</button>
                <button class="mobile-minimal bg-purple-500 text-white rounded">Tool 3</button>
            </div>
        </header>
        
        <!-- Fluid Typography Test -->
        <div class="bg-light-panel dark:bg-cinema-panel responsive-spacing rounded-lg">
            <h3 class="fluid-text-lg font-semibold mb-4">Typography Scale Test</h3>
            <p class="fluid-text-base mb-2">Base text (fluid-text-base)</p>
            <p class="fluid-text-sm mb-2">Small text (fluid-text-sm)</p>
            <p class="fluid-text-xs mb-2">Extra small text (fluid-text-xs)</p>
        </div>
    </div>

    <script>
        function updateBreakpointIndicator() {
            const width = window.innerWidth;
            let breakpoint = '';
            
            if (width >= 1536) breakpoint = '2xl (≥1536px)';
            else if (width >= 1440) breakpoint = 'xl (≥1440px) - Desktop';
            else if (width <= 1280) breakpoint = 'lg-max (≤1280px)';
            else if (width <= 1024) breakpoint = 'lg (≤1024px)';
            else if (width <= 834) breakpoint = 'md-lg (≤834px)';
            else if (width <= 768) breakpoint = 'md (≤768px)';
            else if (width <= 480) breakpoint = 'sm (≤480px)';
            else if (width <= 360) breakpoint = 'xs (≤360px)';
            
            document.getElementById('current-breakpoint').textContent = 
                `${width}px - ${breakpoint}`;
        }
        
        // Update on load and resize
        updateBreakpointIndicator();
        window.addEventListener('resize', updateBreakpointIndicator);
        
        // Test modal functionality
        function showTestModal() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 safe-area modal-fullscreen lg:p-4';
            modal.innerHTML = `
                <div class="modal-mobile lg:modal-responsive bg-white lg:rounded-lg responsive-spacing lg:max-w-md w-full">
                    <h3 class="fluid-text-base font-semibold mb-4">Test Modal</h3>
                    <p class="fluid-text-sm mb-4">This modal should be full-screen on mobile and centered on desktop.</p>
                    <button onclick="this.closest('.fixed').remove()" class="mobile-minimal bg-blue-500 text-white rounded w-full">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        // Add modal test button
        document.addEventListener('DOMContentLoaded', () => {
            const testButton = document.createElement('button');
            testButton.textContent = 'Test Modal';
            testButton.className = 'fixed bottom-4 left-4 mobile-minimal bg-purple-500 text-white rounded z-40';
            testButton.onclick = showTestModal;
            document.body.appendChild(testButton);
        });
    </script>
</body>
</html>
